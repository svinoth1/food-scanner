<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Additive Free</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
  @font-face { font-family: 'Lilita One'; src: url(fonts/LilitaOne.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #eef1f4; margin: 0; padding: 16px; color: #1f2933; }
  .wrap { max-width: 420px; margin: auto; }
  h2 { text-align: center; margin: 4px 0 14px; }
  .foot { text-align: right; margin: 2px 0 8px; font-size: 14px; }
  .how { display: inline-flex; align-items: center; gap: 6px; color: #1e8e3e; font-weight: 700; text-decoration: none; }
  .how:hover { text-decoration: underline; }
  .how-i { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%;
           background: #1e8e3e; color: #fff; font: italic 700 12px Georgia, serif; line-height: 1; }
  .brand-box { display: flex; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(135deg, #e3f5fd 0%, #ffffff 70%); border: 2px solid #b9dff2; border-radius: 14px;
               padding: 7px 14px 7px 10px; margin: 0 0 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .logo { width: 66px; height: 66px; flex: none; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.22)); }
  /* letters like the logo's: white inside, a coloured outline around them (a different rainbow colour for each letter) */
  .rb { color: #fff; text-shadow: 2.30px 0.00px 0 var(--o), 2.13px 0.86px 0 var(--o), 1.65px 1.60px 0 var(--o), 0.94px 2.10px 0 var(--o), 0.08px 2.30px 0 var(--o), -0.79px 2.16px 0 var(--o), -1.54px 1.71px 0 var(--o), -2.07px 1.01px 0 var(--o), -2.29px 0.16px 0 var(--o), -2.19px -0.71px 0 var(--o), -1.76px -1.48px 0 var(--o), -1.08px -2.03px 0 var(--o), -0.24px -2.29px 0 var(--o), 0.63px -2.21px 0 var(--o), 1.42px -1.81px 0 var(--o), 1.99px -1.15px 0 var(--o), 2.28px -0.32px 0 var(--o), 0 3px 2px rgba(0,0,0,.35); }
  .brand-box h2 { margin: 0; text-align: left; font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-weight: 400;
                  text-transform: uppercase; letter-spacing: .03em; font-size: 30px; line-height: 1.2; letter-spacing: .09em; }
  .card { background: #fff; border: 2px solid #cfd6dd; border-radius: 14px; padding: 14px; margin: 14px 0;

  .cam { position: relative; height: 200px; background: #000; border: 3px solid #263238;

  .cam video { width: 100%; height: 100%; object-fit: cover; }
  #frame { position: absolute; top: 25%; left: 10%; width: 80%; height: 50%; border: 2px solid #f44336; display: flex; align-items: center; justify-content: center;
           border-radius: 8px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); overflow: hidden; }
  .scanline { position: absolute; left: 0; width: 100%; height: 2px;
              background: var(--c, #f44336); box-shadow: 0 0 8px 2px var(--c, #f44336);
              animation: scan 1.6s ease-in-out infinite alternate; }
  @keyframes scan { from { top: 0; } to { top: 100%; } }
  #frame.idle { border-color: rgba(255,255,255,.85); }           /* resting: a white box, no moving line */
  #frame.idle .scanline { display: none; }
  /* the Scan button sits inside the barcode box. Press it and it disappears while the app looks for a barcode. */

              border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .scan-btn:hover { background: #197a35; }
  #frame:not(.idle) .scan-btn { display: none; }                 /* hidden while scanning (and during the green flash) */
  #frame:not(.idle) { cursor: pointer; }
  .cam-msg { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 3; text-align: center; font-size: 13px; line-height: 1.35;
             color: #fff; background: rgba(0,0,0,.72); border-radius: 8px; padding: 6px 10px; }

  .scan-label { text-align: center; color: #5f6b76; font-size: 14px; margin: 0 0 9px; }
  .input-row { display: flex; gap: 8px; }
  input { flex: 1; padding: 11px; border: 2px solid #b8c1ca; border-radius: 10px; font-size: 16px; min-width: 0; }

  #status { text-align: center; color: #5f6b76; margin: 0 0 8px; }
  #status:empty { display: none; }   /* no gap when there is no message */
  .prod { display: flex; gap: 14px; align-items: center; }
  .prod img { width: 64px; height: 64px; object-fit: contain; border: 1px solid #cfd6dd; border-radius: 10px; background: #fff; }
  .score { width: 84px; height: 84px; border-radius: 50%; border: 6px solid; flex: none;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           font-size: 26px; font-weight: 700; line-height: 1; }
  .score small { font-size: 12px; font-weight: 400; color: #5f6b76; }
  .muted { color: #5f6b76; font-size: 14px; }
  .card h4 { margin: 0 0 8px; }
  .alt { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer;
         border: 2px solid #cfd6dd; border-radius: 10px; padding: 10px; margin-top: 8px; }
  .alt:hover { border-color: #263238; }
  .alt b.n { font-size: 18px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .card-head h4 { margin: 0; }
  .verified { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; color: #1e8e3e; white-space: nowrap; }
  .tick { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-right: 5px;
          border-radius: 50%; background: #1e8e3e; color: #fff; font-size: 10px; line-height: 1; }
  .counts { margin-bottom: 8px; }
  .back { background: #fff; color: #263238; border: 2px solid #cfd6dd; padding: 7px 14px; font-size: 14px; border-radius: 10px; margin: 0 0 2px; }
  .back:hover { border-color: #263238; }
  .pill { display: inline-block; padding: 3px 9px; border: 1px solid; border-radius: 999px; font-size: 12px;
          font-weight: 700; margin: 2px 4px 2px 0; white-space: nowrap; }
  .add { border: 2px solid #e1e6eb; border-radius: 10px; margin-top: 8px; background: #fff; }
  .add[open] { border-color: #263238; }
  .add-sum { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 11px;
             cursor: pointer; list-style: none; }
  .add-sum::-webkit-details-marker { display: none; }
  .pills { text-align: right; }
  .add-body { padding: 4px 12px 12px; border-top: 1px solid #e1e6eb; font-size: 14px; }
  .add-body h5 { margin: 12px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #5f6b76; }
  .note { background: #f3e9f8; border-left: 4px solid #6a1b9a; padding: 8px 10px; margin-top: 8px; border-radius: 6px; font-size: 13px; }
  .cite { border-left: 3px solid #cfd6dd; padding: 2px 0 2px 10px; margin: 10px 0; }
  .src { display: inline-block; background: #263238; color: #fff; border-radius: 4px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
  .finding { margin-top: 4px; }
  .ref-link { display: inline-block; margin-top: 4px; font-size: 13px; font-weight: 600; color: #1a56db; }
  .scorewrap { position: relative; flex: none; }
  .info { position: absolute; top: -6px; right: -8px; width: 26px; height: 26px; border-radius: 50%; padding: 0;
          background: #263238; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3);
          font: italic 700 15px Georgia, serif; line-height: 1; cursor: pointer; }
  .info:hover, .info:focus-visible { background: #1a56db; outline: none; }
  .info::after { content: attr(data-tip); position: absolute; bottom: 135%; right: -4px; background: #263238; color: #fff;
                 padding: 6px 9px; border-radius: 6px; font: normal 400 12px system-ui, sans-serif; white-space: nowrap;
                 opacity: 0; pointer-events: none; transition: opacity .12s; }
  .info:hover::after, .info:focus-visible::after { opacity: 1; }

  /* the "i" popup */
  .modal { position: fixed; inset: 0; background: rgba(15,23,32,.55); display: flex; align-items: center;
           justify-content: center; z-index: 50; }
  .modal[hidden] { display: none; }
  .sheet { position: relative; background: #fff; width: calc(100% - 32px); max-width: 370px; max-height: 90vh;
           overflow-y: auto; padding: 12px 14px 14px; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.3); }
  .close { position: absolute; top: 7px; right: 8px; width: 24px; height: 24px; padding: 0; border-radius: 50%;
           background: #eef1f4; color: #263238; font-size: 16px; line-height: 1; }
  .calc-top { margin: 0 0 2px; font-size: 11px; }
  .calc-top .big { font-size: 26px; font-weight: 800; }
  .calc { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 8px; border: 1px solid #cfd6dd;
          border-radius: 8px; overflow: hidden; }
  .calc th { background: #eef2f6; text-align: left; font-size: 8px; text-transform: uppercase; letter-spacing: .05em;
             color: #5f6b76; padding: 4px 8px; border-bottom: 1px solid #cfd6dd; }
  .calc th.v { text-align: right; border-left: 1px solid #cfd6dd; }
  .calc td { padding: 6px 8px; border-bottom: 1px solid #e1e6eb; vertical-align: top; font-size: 11px; }
  .calc tr:last-child td { border-bottom: 0; }
  .calc td.v { text-align: right; font-size: 15px; font-weight: 800; white-space: nowrap; min-width: 40px;
               border-left: 1px solid #cfd6dd; }
  .ng { border: 1.5px solid #263238; border-radius: 8px; padding: 5px 10px 6px; margin: 8px 0 4px; background: #fff; }
  .ng-t { text-align: center; font-weight: 800; font-size: 11px; letter-spacing: .06em; color: #111; margin-bottom: 11px; }
  .ng-strip { display: flex; height: 20px; border-radius: 999px; margin: 0 2px; }
  .ng-s { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; }
  .ng-s:first-child { border-radius: 999px 0 0 999px; }
  .ng-s:last-child { border-radius: 0 999px 999px 0; }
  .ng-c { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; width: 34px; height: 34px; border-radius: 50%;
          border: 3.5px solid #111; box-shadow: 0 0 0 1.5px #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; }
  .ng-p { display: flex; margin: 14px 2px 0; }
  .ng-p span { flex: 1; text-align: center; font-size: 10px; color: #5f6b76; }
  .calc .why { font-size: 9px; color: #5f6b76; font-weight: 400; margin-top: 1px; line-height: 1.35; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-box">
    <img class="logo" src="logo.png" alt="Additive Free logo"
         onerror="if(!this.dataset.t){this.dataset.t=1;this.src='logo.jpg'}else{this.style.display='none'}">
    <h2 aria-label="Additive Free"><span class="rb" style="--o:#e0342f">A</span><span class="rb" style="--o:#f57c00">D</span><span class="rb" style="--o:#e9a800">D</span><span class="rb" style="--o:#3da83a">I</span><span class="rb" style="--o:#2a6fdb">T</span><span class="rb" style="--o:#4b3fc7">I</span><span class="rb" style="--o:#8e3fc2">V</span><span class="rb" style="--o:#e0342f">E</span> <span class="rb" style="--o:#f57c00">F</span><span class="rb" style="--o:#e9a800">R</span><span class="rb" style="--o:#3da83a">E</span><span class="rb" style="--o:#2a6fdb">E</span></h2>
  </div>
  <div class="cam" id="cam">
    <video id="video" muted playsinline></video>
    <div id="frame" class="idle">
      <div class="scanline"></div>
      <button id="scanBtn" class="scan-btn" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
        Scan
      </button>
    </div>
    <div id="camMsg" class="cam-msg"></div>
  </div>
  <div class="card">
    <div class="scan-label">Scan or type the barcode to get started</div>
    <div class="input-row">
      <input id="code" placeholder="Barcode number" inputmode="numeric">
      <button id="go">Check</button>
    </div>
  </div>
  <p id="status"></p>
  <div id="out"></div>
  <div class="foot"><a class="how" href="info.html" target="_blank" rel="noopener"><span class="how-i">i</span>How Additive-Free works</a></div>
</div>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="How the score is calculated">
    <button id="modal-close" class="close" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API = 'https://world.openfoodfacts.org/api/v2/';
const FIELDS = 'code,product_name,brands,image_front_small_url,categories_tags,nutriscore_grade,nova_group,additives_tags';

// Additive ratings: additives-app.json (Sito, sito.kids/additives). Loaded once when the page opens.
let ADD = {}, addMeta = {}, addFailed = false;
const dataReady = fetch('additives-app.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { d.additives.forEach(a => { ADD[a.e_number.toLowerCase()] = a; }); addMeta = d; })
  .catch(() => { addFailed = true; });

// Open Food Facts writes tags like "en:e322i"; our table may only have "e322"
function findAdditive(tag) {
  const e = tag.replace('en:', '').toLowerCase();
  if (ADD[e]) return ADD[e];
  const base = e.replace(/[a-z]+$/, '');          // e322i -> e322
  if (ADD[base]) return ADD[base];
  if (/^e14\d\d/.test(e)) return ADD['e14xx'] || null;   // modified starches are one group
  return null;
}

// one row per additive (e322 and e322i are the same thing), rated or not
function resolveAdditives(tags) {
  const seen = {}, out = [];
  (tags || []).forEach(t => {
    const info = findAdditive(t), key = info ? info.e_number : t;
    if (seen[key]) return;
    seen[key] = 1;
    out.push({ tag: t, info });
  });
  return out;
}

// Works out the score step by step, so the "i" popup can show every step
function scoreBreakdown(p) {
  let base = { a: 90, b: 75, c: 55, d: 35, e: 15 }[p.nutriscore_grade], label, nutri = true;
  if (base !== undefined) label = 'Nutri-Score ' + p.nutriscore_grade.toUpperCase();
  else if (p.nova_group) {            // many US products have no Nutri-Score
    base = { 1: 90, 2: 70, 3: 50, 4: 25 }[p.nova_group];
    label = 'NOVA group ' + p.nova_group; nutri = false;
  }
  if (base === undefined) return null;
  // each rated additive removes points: high 30, moderate 15, low 6, none 0 (from the table); capped at 40
  const items = resolveAdditives(p.additives_tags).map(x => ({
    name: x.info ? x.info.name : x.tag.replace('en:', '').toUpperCase(),
    e: x.info ? x.info.e_number : '',
    cls: x.info ? x.info.risk_class : 'unrated',
    points: x.info ? x.info.points_removed : 0
  })).sort((a, b) => b.points - a.points);
  const raw = items.reduce((sum, i) => sum + i.points, 0), applied = Math.min(raw, 40);
  return { base, label, nutri, items, raw, applied, capped: raw > 40, final: Math.max(0, base - applied) };
}

function scoreProduct(p) {
  const b = scoreBreakdown(p);
  return b ? b.final : null;
}

function rating(score) {
  return score >= 75 ? ['Excellent', '#1e8e3e'] :
         score >= 50 ? ['Good', '#7cb342'] :
         score >= 25 ? ['Poor', '#f9a825'] : ['Bad', '#d93025'];
}

const CLASS = {
  high:    { label: 'High risk',          color: '#c62828' },
  mid:     { label: 'Moderate risk',      color: '#e65100' },
  low:     { label: 'Low risk',           color: '#a67c00' },
  none:    { label: 'No risk identified', color: '#1e8e3e' },
  unrated: { label: 'Not rated',          color: '#6b7785' }
};
const ORDER = { high: 0, mid: 1, low: 2, unrated: 3, none: 4 };
const SRC_LABEL = { EFSA: 'EFSA (EU)', FDA: 'US FDA', state_law: 'Law', OEHHA: 'California OEHHA', peer_reviewed: 'Study',
                    IARC: 'IARC (WHO)', agency_review: 'Agency review', OFF: 'Open Food Facts' };

function additiveRow(x) {
  const a = x.info;
  if (!a) {
    const e = x.tag.replace('en:', '').toUpperCase();
    return '<div class="add"><div class="add-sum"><div><b>' + esc(e) + '</b><div class="muted">No rating for this additive yet</div></div>' +
      '<span class="pill" style="color:' + CLASS.unrated.color + ';border-color:' + CLASS.unrated.color + '">Not rated</span></div></div>';
  }
  const cl = CLASS[a.risk_class];
  const cites = a.citations.map(c => {
    const link = c.url ? '<a class="ref-link" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer">' +
      (c.url_kind === 'database' ? 'See the list' : 'Read the source') + ' &#8599;</a>' : '';
    return '<div class="cite"><span class="src">' + esc(SRC_LABEL[c.source] || c.source) + '</span>' +
      '<div class="finding">' + esc(c.simple || c.finding) + '</div>' + link + '</div>';
  }).join('');
  return '<details class="add"><summary class="add-sum">' +
      '<div><b>' + esc(a.name) + '</b><div class="muted">' + esc(a.e_number) + ' &middot; ' + esc(a.category.replace(/_/g, ' ')) + '</div></div>' +
      '<div class="pills">' +
      '<span class="pill" style="color:' + cl.color + ';border-color:' + cl.color + ';background:' + cl.color + '1a">' + cl.label + '</span></div>' +
    '</summary><div class="add-body">' +
      '<h5>Why it got this rating</h5>' + cites +
    '</div></details>';
}

// ---- the "i" popup: how a score was calculated ----
let current = null;     // the product being shown: { name, bd }

function scoreInfoHTML(cur) {
  const bd = cur.bd, [label, color] = rating(bd.final);
  const FACTORY = { 1: 'Natural, hardly changed', 2: 'A simple cooking ingredient', 3: 'A few factory steps', 4: 'Made in a factory with lots of extras' };
  const g = bd.label.slice(-1), n = Number(bd.label.replace(/\D/g, ''));

  // the one graph: the scale this food was graded on, with its own grade (or level) in the big ringed circle
  const GRADES = [['A', '#3a8a4a', 90], ['B', '#8dc63f', 75], ['C', '#eea43b', 55], ['D', '#d9622b', 35], ['E', '#b3302b', 15]];
  // no official Nutri-Score for this food? then show the closest grade to the points its processing level gives
  const closest = GRADES.reduce((best, x) => Math.abs(x[2] - bd.base) < Math.abs(best[2] - bd.base) ? x : best)[0];
  const items = GRADES, sel = bd.nutri ? g : closest;
  const picture = '<div class="ng"><div class="ng-t">' + 'NUTRI-GRADE' + '</div><div class="ng-strip">' +
    items.map(x => '<span class="ng-s" style="background:' + x[1] + '">' + (x[0] === sel ? '<b class="ng-c" style="background:' + x[1] + '">' + x[0] + '</b>' : x[0]) + '</span>').join('') +
    '</div><div class="ng-p">' + items.map(x => '<span>' + x[2] + '</span>').join('') + '</div></div>';

  let h = '<div class="calc-top"><span class="big" style="color:' + color + '">' + bd.final + '</span><span>/100 &nbsp;<b style="color:' + color + '">' + label + '</b></span></div>' + picture;

  // two lines only: the food's points, and what the risky extras take away (the score is the big number above)
  const why = bd.nutri
    ? 'Grade ' + g + ' starts at <b>' + bd.base + '</b> points.'
    : (FACTORY[n] || 'Made in a factory') + '. Level ' + n + ' starts at <b>' + bd.base + '</b> points.';
  const risky = bd.items.filter(i => i.points > 0);
  let extras;
  if (addFailed) extras = 'We could not load the list of extras';
  else if (!bd.items.length) extras = 'No extras in this food, so nothing is taken away';
  else if (!risky.length) extras = 'None of the extras worry us, so nothing is taken away';
  else extras = risky.map(i => esc(i.name) + ' <b>&minus;' + i.points + '</b>').join('<br>') +
    (bd.capped ? '<br>The most we take away is 40' : '');
  const floor = bd.base - bd.applied < 0 ? '<div class="why">' + bd.base + ' &minus; ' + bd.applied + ' is below 0, so the score is 0</div>' : '';
  h += '<table class="calc"><tr><th>What we count</th><th class="v">Points</th></tr>' +
    '<tr><td><b style="color:#1e8e3e">Good</b><div class="why">' + why + '</div></td><td class="v">' + bd.base + '</td></tr>' +
    '<tr><td><b style="color:#d93025">Bad</b><div class="why">' + extras + '</div>' + floor + '</td><td class="v">' + (bd.applied ? '&minus;' + bd.applied : '0') + '</td></tr>' +
    '</table>';
  return h;
}

function openScoreInfo() {
  if (!current) return;
  $('modal-body').innerHTML = scoreInfoHTML(current);
  $('modal').hidden = false;
  document.body.style.overflow = 'hidden';
  $('modal-close').focus();
}
function closeScoreInfo() {
  $('modal').hidden = true;
  document.body.style.overflow = '';
}

async function findAlternatives(p, myScore) {
  const cats = (p.categories_tags || []).slice().reverse().slice(0, 3);
  for (const cat of cats) {
    const url = API + 'search?categories_tags=' + encodeURIComponent(cat) +
      '&fields=' + FIELDS + '&sort_by=unique_scans_n&page_size=40';
    const data = await (await fetch(url)).json();
    const better = (data.products || [])
      .filter(x => x.code !== p.code && x.product_name)
      .map(x => ({ ...x, score: scoreProduct(x) }))
      .filter(x => x.score !== null && x.score > myScore)
      .sort((a, b) => b.score - a.score)
      .slice(0, 3);
    if (better.length) return better;
  }
  return [];
}

// earlier results the Back button can return to, and a ticket number so an old search cannot write over a newer screen
let backStack = [], requestId = 0;
const BACK = '<button class="back" type="button">&larr; Back</button>';
function showBack() { if (backStack.length) $('out').insertAdjacentHTML('afterbegin', BACK); }
function goBack() {
  const prev = backStack.pop();
  if (!prev) return;
  requestId++;                       // cancel any search that is still running
  $('out').innerHTML = prev.html;
  current = prev.current;
  $('code').value = prev.code;
  $('status').textContent = '';
}

async function check(code, keepBack) {
  code = code.trim();
  if (code.length === 12) code = '0' + code;   // USA UPC-A -> EAN-13
  if (!keepBack) backStack = [];               // a fresh scan starts a fresh trail
  const myId = ++requestId;
  $('status').textContent = 'Looking up ' + code + '...';
  $('out').innerHTML = '';
  await dataReady;

  try {
    const data = await (await fetch(API + 'product/' + code + '.json?fields=' + FIELDS)).json();
    if (myId !== requestId) return;
    if (data.status !== 1) { $('status').textContent = 'Barcode ' + code + ': product not found'; showBack(); return; }
    const p = data.product;
    p.code = code;
    $('status').textContent = '';

    const bd = scoreBreakdown(p);
    const score = bd ? bd.final : null;
    current = { name: p.product_name || code, bd };
    const [label, color] = score === null ? ['Not enough data', '#8895a1'] : rating(score);
    const img = p.image_front_small_url ? '<img src="' + esc(p.image_front_small_url) + '">' : '';
    let html = '<div class="card"><div class="prod">' +
      '<div class="scorewrap"><div class="score" style="border-color:' + color + ';color:' + color + '">' +
        (score === null ? '?' : score + '<small>/100</small>') + '</div>' +
        (bd ? '<button class="info" data-tip="How is this score calculated?" aria-label="How is this score calculated?">i</button>' : '') + '</div>' +
      '<div><b>' + esc(p.product_name || code) + '</b><br>' +
      '<span class="muted">' + esc(p.brands || '') + '</span><br>' +
      '<b style="color:' + color + '">' + label + '</b></div>' + img +
      '</div></div>';

    const rows = resolveAdditives(p.additives_tags)
      .sort((x, y) => ORDER[x.info ? x.info.risk_class : 'unrated'] - ORDER[y.info ? y.info.risk_class : 'unrated']);
    const cnt = {};
    rows.forEach(x => { const k = x.info ? x.info.risk_class : 'unrated'; cnt[k] = (cnt[k] || 0) + 1; });
    const vd = addMeta.link_validation && addMeta.link_validation.checked_on;     // e.g. "2026-10-24"
    const verified = vd && rows.length
      ? '<span class="verified"><span class="tick">&#10003;</span>Verified on ' +
        new Date(vd + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) + '</span>' : '';
    html += '<div class="card"><div class="card-head"><h4>Additives (' + rows.length + ')</h4>' + verified + '</div>';
    if (addFailed) html += '<div class="note">The additive ratings file could not be loaded, so additives are not scored.</div>';
    if (!rows.length) html += '<span class="muted">None found</span>';
    else {
      html += '<div class="counts">' + ['high', 'mid', 'low', 'none', 'unrated'].filter(k => cnt[k]).map(k =>
        '<span class="pill" style="color:' + CLASS[k].color + ';border-color:' + CLASS[k].color + '">' + cnt[k] + ' ' + CLASS[k].label.toLowerCase() + '</span>').join('') + '</div>';
      html += rows.map(additiveRow).join('');
    }
    html += '</div>';
    $('out').innerHTML = html;
    showBack();

    if (score !== null && score < 90) {
      $('status').textContent = 'Looking for better alternatives...';
      let alts = null;
      try { alts = await findAlternatives(p, score); } catch (e) { alts = null; }
      if (myId !== requestId) return;
      $('status').textContent = '';
      let h = '<div class="card"><h4>Better alternatives</h4>';
      if (alts === null) h += '<span class="muted">Could not look for better products right now. Try again in a minute.</span>';
      else if (!alts.length) h += '<span class="muted">No better product found in this category.</span>';
      else h += alts.map(a => {
        const [l, c] = rating(a.score);
        return '<div class="alt" data-code="' + esc(a.code) + '">' +
          '<div><b>' + esc(a.product_name) + '</b><br><span class="muted">' + esc(a.brands || '') + '</span></div>' +
          '<div style="text-align:right;color:' + c + '"><b class="n">' + a.score + '</b><br>' + l + '</div></div>';
      }).join('');
      $('out').insertAdjacentHTML('beforeend', h + '</div>');
    }
  } catch (e) {
    if (myId === requestId) {
      $('status').textContent = 'Could not get the product data (' + e.message + '). Open Food Facts may be busy. Try again in a minute.';
      showBack();
    }
  }
}

// click an alternative to check it
$('out').onclick = e => {
  if (e.target.closest('.info')) { openScoreInfo(); return; }
  if (e.target.closest('.back')) { goBack(); return; }
  const el = e.target.closest('[data-code]');
  if (el) {
    backStack.push({ html: $('out').innerHTML, current, code: $('code').value });   // remember where we were
    $('code').value = el.dataset.code;
    check(el.dataset.code, true);
  }
};

$('go').onclick = () => check($('code').value);
$('modal-close').onclick = closeScoreInfo;
$('modal').onclick = e => { if (e.target === $('modal')) closeScoreInfo(); };   // click outside the sheet
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeScoreInfo(); });

const COLORS = { red: '#f44336', yellow: '#ffc107', green: '#00e676' };
let holdUntil = 0;
function setState(s) {                       // while scanning: red = nothing, yellow = barcode seen but not readable yet, green = read OK
  $('frame').classList.remove('idle');
  $('frame').style.setProperty('--c', COLORS[s]);
  $('frame').style.borderColor = COLORS[s];
}
function setIdle() {                         // resting: a white box and no moving line
  $('frame').classList.add('idle');
  $('frame').style.borderColor = '';
}

let stream = null, reader = null, scanning = false, scanTimer = null, scanEnds = 0;
const canvas = document.createElement('canvas');

function camProblem(e) {                    // a clear message inside the camera when the camera cannot start
  const name = e && e.name;
  let text;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) text = 'The camera needs a secure page. Open this site with https.';
  else if (name === 'NotAllowedError' || name === 'SecurityError') text = 'The camera is blocked. Click the camera icon in the address bar, choose Allow, then press Scan again.';
  else if (name === 'NotFoundError' || name === 'OverconstrainedError') text = 'No camera was found on this device.';
  else if (name === 'NotReadableError') text = 'The camera is busy. Close other apps that use it, then press Scan again.';
  else text = 'Could not start the camera' + (e && e.message ? ': ' + e.message : '.');
  $('camMsg').textContent = text;
}

// Switch the camera on. This only happens when the Scan button is pressed, never when the page opens.
async function startCamera() {
  if (stream) return true;
  $('camMsg').textContent = 'Starting the camera... (allow it if your browser asks)';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: {
      facingMode: 'environment',
      width: { ideal: 1280 }, height: { ideal: 720 },
      advanced: [{ focusMode: 'continuous' }]
    } });
    $('video').srcObject = stream;
    await $('video').play();
    $('camMsg').textContent = '';
    return true;
  } catch (e) {
    stream = null;
    camProblem(e);
    return false;
  }
}

function stopCamera() {                      // switch the camera off again
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('video').srcObject = null;
}

// the Scan button (inside the barcode box): pressing it switches the camera on and looks for a barcode; tapping the box while it scans stops it
async function toggleScan() {
  if (scanning) { stopScan(''); return; }
  if (!window.ZXingBrowser) { $('status').textContent = 'Scanner library failed to load'; return; }
  if (!(await startCamera())) return;
  // only look for product barcodes (EAN-13, EAN-8, UPC-A, UPC-E) = faster, fewer false reads
  if (!reader) reader = new ZXingBrowser.BrowserMultiFormatReader(new Map([[2, [7, 6, 14, 15]]]));
  scanning = true;
  scanEnds = Date.now() + 15000;             // give up after 15 seconds
  holdUntil = 0;
  setState('red');
  $('status').textContent = 'Scanning... hold the barcode steady in the box (tap the box to stop)';
  scanLoop();
}

function stopScan(message) {
  scanning = false;
  clearTimeout(scanTimer);
  stopCamera();
  setIdle();
  $('status').textContent = message;
}

// while scanning: take a still picture from the camera ten times a second and try to read it
function scanLoop() {
  if (!scanning) return;
  if (Date.now() > scanEnds) { stopScan('Could not read a barcode. Press Scan to try again.'); return; }
  const v = $('video');
  if (v.videoWidth) {
    canvas.width = v.videoWidth;
    canvas.height = v.videoHeight;
    canvas.getContext('2d', { willReadFrequently: true }).drawImage(v, 0, 0);
    try {
      gotBarcode(reader.decodeFromCanvas(canvas).getText());
      return;
    } catch (err) {
      const kind = err && (err.getKind ? err.getKind() : err.name);
      const now = Date.now();
      if (kind === 'ChecksumException' || kind === 'FormatException') {
        if (now >= holdUntil) { setState('yellow'); holdUntil = now + 500; }
      } else if (now >= holdUntil) {
        setState('red');
      }
    }
  }
  scanTimer = setTimeout(scanLoop, 100);
}

function gotBarcode(text) {
  scanning = false;
  clearTimeout(scanTimer);
  setState('green');                         // flash green, then switch the camera off and rest
  setTimeout(() => { if (!scanning) { stopCamera(); setIdle(); } }, 1000);
  if (navigator.vibrate) navigator.vibrate(100);
  $('code').value = text;                    // show the scanned number in the text box
  check(text);
}

$('scanBtn').onclick = e => { e.stopPropagation(); toggleScan(); };
$('frame').onclick = () => { if (scanning) stopScan(''); };      // tap the box while scanning to stop
document.addEventListener('visibilitychange', () => { if (document.hidden && scanning) stopScan(''); });

</script>
</body>
</html>
