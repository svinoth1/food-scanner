<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #eef1f4; margin: 0; padding: 16px; color: #1f2933; }
  .wrap { max-width: 420px; margin: auto; }
  h2 { text-align: center; margin: 4px 0 14px; }
  .card { background: #fff; border: 2px solid #cfd6dd; border-radius: 14px; padding: 14px; margin: 14px 0;
          box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .cam { position: relative; height: 200px; background: #000; border: 3px solid #263238;
         border-radius: 14px; overflow: hidden; }
  .cam video { width: 100%; height: 100%; object-fit: cover; }
  #frame { position: absolute; top: 25%; left: 10%; width: 80%; height: 50%; border: 2px solid #f44336;
           border-radius: 8px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); overflow: hidden; }
  .scanline { position: absolute; left: 0; width: 100%; height: 2px;
              background: var(--c, #f44336); box-shadow: 0 0 8px 2px var(--c, #f44336);
              animation: scan 1.6s ease-in-out infinite alternate; }
  @keyframes scan { from { top: 0; } to { top: 100%; } }
  .input-row { display: flex; gap: 8px; }
  input { flex: 1; padding: 11px; border: 2px solid #b8c1ca; border-radius: 10px; font-size: 16px; min-width: 0; }
  button { padding: 11px 18px; border: 0; border-radius: 10px; background: #263238; color: #fff;
           font-size: 16px; cursor: pointer; }
  #status { text-align: center; color: #5f6b76; min-height: 1.2em; margin: 8px 0; }
  .prod { display: flex; gap: 14px; align-items: center; }
  .prod img { width: 64px; height: 64px; object-fit: contain; border: 1px solid #cfd6dd; border-radius: 10px; background: #fff; }
  .score { width: 84px; height: 84px; border-radius: 50%; border: 6px solid; flex: none;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           font-size: 26px; font-weight: 700; line-height: 1; }
  .score small { font-size: 12px; font-weight: 400; color: #5f6b76; }
  .muted { color: #5f6b76; font-size: 14px; }
  .card h4 { margin: 0 0 8px; }
  .chip { display: inline-block; padding: 4px 10px; border: 1px solid; border-radius: 999px;
          font-size: 13px; font-weight: 600; margin: 3px 4px 0 0; }
  .alt { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer;
         border: 2px solid #cfd6dd; border-radius: 10px; padding: 10px; margin-top: 8px; }
  .alt:hover { border-color: #263238; }
  .alt b.n { font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>🥗 Food Scanner</h2>
  <div class="cam">
    <video id="video" muted playsinline></video>
    <div id="frame"><div class="scanline"></div></div>
  </div>
  <div class="card input-row">
    <input id="code" placeholder="or type barcode" inputmode="numeric">
    <button id="go">Check</button>
  </div>
  <p id="status"></p>
  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API = 'https://world.openfoodfacts.org/api/v2/';
const FIELDS = 'code,product_name,brands,image_front_small_url,categories_tags,nutriscore_grade,nova_group,additives_tags';
let lastCode = '';

// Simplified additive risk list (approximation of Yuka-style ratings). Anything not listed = low.
const HIGH = ['e102','e104','e110','e122','e124','e129','e171','e249','e250','e251','e252','e320','e321'];
const MEDIUM = ['e150c','e150d','e211','e220','e221','e222','e223','e224','e225','e226','e227','e228',
  'e338','e339','e340','e341','e407','e407a','e450','e451','e452','e621','e950','e951','e954','e955'];

function additiveRisk(tag) {
  const e = tag.replace('en:', '').toLowerCase();
  if (HIGH.includes(e)) return 'high';
  if (MEDIUM.includes(e)) return 'medium';
  return 'low';
}

function scoreProduct(p) {
  let score = { a: 90, b: 75, c: 55, d: 35, e: 15 }[p.nutriscore_grade];
  if (score === undefined && p.nova_group) score = { 1: 90, 2: 70, 3: 50, 4: 25 }[p.nova_group];
  if (score === undefined) return null;
  const penalty = { high: 10, medium: 5, low: 1 };
  const total = (p.additives_tags || []).reduce((sum, t) => sum + penalty[additiveRisk(t)], 0);
  return Math.max(0, score - Math.min(total, 30));
}

function rating(score) {
  return score >= 75 ? ['Excellent', '#1e8e3e'] :
         score >= 50 ? ['Good', '#7cb342'] :
         score >= 25 ? ['Poor', '#f9a825'] : ['Bad', '#d93025'];
}

const RISK_COLOR = { high: '#d93025', medium: '#f9a825', low: '#1e8e3e' };

// Find better products in the same category (most specific category first)
async function findAlternatives(p, myScore) {
  const cats = (p.categories_tags || []).slice().reverse().slice(0, 3);
  for (const cat of cats) {
    const url = API + 'search?categories_tags=' + encodeURIComponent(cat) +
      '&fields=' + FIELDS + '&sort_by=unique_scans_n&page_size=40';
    const data = await (await fetch(url)).json();
    const better = (data.products || [])
      .filter(x => x.code !== p.code && x.product_name)
      .map(x => ({ ...x, score: scoreProduct(x) }))
      .filter(x => x.score !== null && x.score > myScore)
      .sort((a, b) => b.score - a.score)
      .slice(0, 3);
    if (better.length) return better;
  }
  return [];
}

async function check(code) {
  code = code.trim();
  if (code.length === 12) code = '0' + code;   // USA UPC-A -> EAN-13
  $('status').textContent = 'Looking up ' + code + '...';
  $('out').innerHTML = '';

  try {
    const data = await (await fetch(API + 'product/' + code + '.json?fields=' + FIELDS)).json();
    if (data.status !== 1) { $('status').textContent = 'Barcode ' + code + ': product not found'; return; }
    const p = data.product;
    p.code = code;
    $('status').textContent = '';

    const score = scoreProduct(p);
    const [label, color] = score === null ? ['Not enough data', '#8895a1'] : rating(score);
    const img = p.image_front_small_url ? '<img src="' + esc(p.image_front_small_url) + '">' : '';
    let html = '<div class="card"><div class="prod">' +
      '<div class="score" style="border-color:' + color + ';color:' + color + '">' +
        (score === null ? '?' : score + '<small>/100</small>') + '</div>' +
      '<div><b>' + esc(p.product_name || code) + '</b><br>' +
      '<span class="muted">' + esc(p.brands || '') + '</span><br>' +
      '<b style="color:' + color + '">' + label + '</b></div>' + img +
      '</div></div>';

    const adds = p.additives_tags || [];
    html += '<div class="card"><h4>Additives (' + adds.length + ')</h4>';
    if (!adds.length) html += '<span class="muted">None found</span>';
    else html += adds.map(t => {
      const r = additiveRisk(t), c = RISK_COLOR[r];
      return '<span class="chip" style="color:' + c + ';border-color:' + c + ';background:' + c + '1a">' +
        esc(t.replace('en:', '').toUpperCase()) + ' · ' + r + '</span>';
    }).join('');
    html += '</div>';
    $('out').innerHTML = html;

    if (score !== null && score < 90) {
      $('status').textContent = 'Looking for better alternatives...';
      const alts = await findAlternatives(p, score);
      $('status').textContent = '';
      let h = '<div class="card"><h4>Better alternatives</h4>';
      if (!alts.length) h += '<span class="muted">No better product found in this category.</span>';
      else h += alts.map(a => {
        const [l, c] = rating(a.score);
        return '<div class="alt" data-code="' + esc(a.code) + '">' +
          '<div><b>' + esc(a.product_name) + '</b><br><span class="muted">' + esc(a.brands || '') + '</span></div>' +
          '<div style="text-align:right;color:' + c + '"><b class="n">' + a.score + '</b><br>' + l + '</div></div>';
      }).join('');
      $('out').insertAdjacentHTML('beforeend', h + '</div>');
    }
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  }
}

// click an alternative to check it
$('out').onclick = e => {
  const el = e.target.closest('[data-code]');
  if (el) { $('code').value = el.dataset.code; check(el.dataset.code); }
};

$('go').onclick = () => check($('code').value);

const COLORS = { red: '#f44336', yellow: '#ffc107', green: '#00e676' };
let holdUntil = 0;
function setState(s) {
  $('frame').style.setProperty('--c', COLORS[s]);
  $('frame').style.borderColor = COLORS[s];
}

let running = false;
async function startCamera() {
  if (running) return;
  running = true;
  if (!window.ZXingBrowser) { running = false; $('status').textContent = 'Scanner library failed to load'; return; }
  try {
    // only look for product barcodes (EAN-13, EAN-8, UPC-A, UPC-E) = faster, fewer false reads
    const hints = new Map([[2, [7, 6, 14, 15]]]);
    const reader = new ZXingBrowser.BrowserMultiFormatReader(hints, { delayBetweenScanAttempts: 100 });
    const constraints = { video: {
      facingMode: 'environment',
      width: { ideal: 1280 }, height: { ideal: 720 },
      advanced: [{ focusMode: 'continuous' }]
    } };
    await reader.decodeFromConstraints(constraints, $('video'), (r, err) => {
      // line color: red = nothing, yellow = barcode seen but not readable yet, green = read OK
      const now = Date.now();
      const kind = err && (err.getKind ? err.getKind() : err.name);
      if (r) {
        setState('green'); holdUntil = now + 1500;
      } else if (kind === 'ChecksumException' || kind === 'FormatException') {
        if (now >= holdUntil) { setState('yellow'); holdUntil = now + 500; }
      } else if (now >= holdUntil) {
        setState('red');
      }

      if (r && r.getText() !== lastCode) {
        lastCode = r.getText();
        $('code').value = lastCode;   // show the scanned number in the input box
        if (navigator.vibrate) navigator.vibrate(100);
        setTimeout(() => { lastCode = ''; }, 3000);   // allow re-scanning the same item
        check(lastCode);
      }
    });
    $('status').textContent = '';
  } catch (e) {
    running = false;
    $('status').textContent = 'Camera error: ' + e.message + ' - allow camera access and reload the page';
  }
}

startCamera();   // start automatically on page load; scanning is then automatic
</script>
</body>
</html>
